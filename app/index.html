<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/app/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="浮光掠影 Web 端，提供影视信息浏览、搜索、记录管理与媒体播放功能。">
  <meta name="theme-color" content="#0B6F69">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="浮光掠影">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>浮光掠影</title>
  <link rel="manifest" href="manifest.json">
  <link rel="preload" href="main.dart.js" as="script">
  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      background: #f7faf9;
    }
    #app-loading {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      color: #0b6f69;
      font: 500 16px system-ui, sans-serif;
    }
    #app-loading-content {
      display: grid;
      justify-items: center;
      gap: 16px;
    }
    #app-loading-mark {
      width: 52px;
      height: 52px;
      display: grid;
      place-items: center;
      border-radius: 8px;
      background: #0b6f69;
      color: #fff;
      font-size: 26px;
    }
    #app-loading-progress {
      width: 160px;
      height: 3px;
      overflow: hidden;
      background: #d9e7e5;
    }
    #app-loading-progress::after {
      content: '';
      display: block;
      width: 45%;
      height: 100%;
      background: #d44b3e;
      animation: loading 1.1s ease-in-out infinite alternate;
    }
    @keyframes loading {
      from { transform: translateX(-20%); }
      to { transform: translateX(145%); }
    }
  </style>
</head>
<body>
  <div id="app-loading" role="status" aria-live="polite">
    <div id="app-loading-content">
      <div id="app-loading-mark">浮</div>
      <div>浮光掠影</div>
      <div id="app-loading-progress"></div>
    </div>
  </div>
  <script src="flutter_bootstrap.js?v=2" async></script>
</body>
</html>
