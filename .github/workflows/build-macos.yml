name: Build macOS

on:
  push:
    branches:
      - app-macos-ci
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: macOS release
    runs-on: macos-15
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer

    steps:
      - name: Check out application source
        uses: actions/checkout@v5

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.35.7
          channel: stable
          cache: true

      - name: Generate macOS platform project
        run: |
          flutter config --enable-macos-desktop
          cp pubspec.lock "$RUNNER_TEMP/hsmovie-pubspec.lock"
          flutter create --platforms=macos --org com.mocoav --no-pub .
          cp "$RUNNER_TEMP/hsmovie-pubspec.lock" pubspec.lock

      - name: Apply macOS branding
        run: |
          set -euo pipefail

          sed -i '' 's/^PRODUCT_NAME = .*/PRODUCT_NAME = 浮光掠影/' \
            macos/Runner/Configs/AppInfo.xcconfig

          /usr/libexec/PlistBuddy \
            -c "Add :CFBundleDisplayName string 浮光掠影" \
            macos/Runner/Info.plist

          LC_ALL=en_US.UTF-8 sed -i '' 's/ble_project/浮光掠影/g' \
            macos/Runner/Base.lproj/MainMenu.xib

          for SIZE in 16 32 64 128 256 512 1024; do
            sips -z "$SIZE" "$SIZE" \
              .github/assets/macos_app_icon.png \
              --out "macos/Runner/Assets.xcassets/AppIcon.appiconset/app_icon_${SIZE}.png"
          done

          plutil -lint macos/Runner/Info.plist

      - name: Allow outbound network access
        run: |
          set -euo pipefail

          for ENTITLEMENTS in \
            macos/Runner/DebugProfile.entitlements \
            macos/Runner/Release.entitlements; do
            /usr/libexec/PlistBuddy \
              -c "Add :com.apple.security.network.client bool true" \
              "$ENTITLEMENTS"
            plutil -lint "$ENTITLEMENTS"
          done

      - name: Resolve dependencies
        run: |
          set +e
          flutter pub get --enforce-lockfile 2>&1 | tee pub-get.log
          PUB_EXIT=${PIPESTATUS[0]}

          if [[ $PUB_EXIT -ne 0 ]]; then
            SUMMARY="$(tail -n 120 pub-get.log)"
            SUMMARY="${SUMMARY//'%'/'%25'}"
            SUMMARY="${SUMMARY//$'\r'/'%0D'}"
            SUMMARY="${SUMMARY//$'\n'/'%0A'}"
            echo "::error title=Dependency resolution failed::$SUMMARY"
          fi

          exit "$PUB_EXIT"

      - name: Upload dependency log
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: hsmovie-macos-dependency-log
          path: pub-get.log
          if-no-files-found: error
          retention-days: 7

      - name: Build unsigned release
        run: |
          set +e
          flutter build macos --release --no-pub 2>&1 | tee build-macos.log
          BUILD_EXIT=${PIPESTATUS[0]}

          if [[ $BUILD_EXIT -ne 0 ]]; then
            FIRST_ERRORS="$(grep -nE '(^|: )(Error|error):' build-macos.log | head -n 80 || true)"
            printf -v SUMMARY 'First compiler errors:\n%s\n\nEnd of build log:\n%s' "$FIRST_ERRORS" "$(tail -n 80 build-macos.log)"
            SUMMARY="${SUMMARY//'%'/'%25'}"
            SUMMARY="${SUMMARY//$'\r'/'%0D'}"
            SUMMARY="${SUMMARY//$'\n'/'%0A'}"
            echo "::error title=macOS build failed::$SUMMARY"
          fi

          exit "$BUILD_EXIT"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: hsmovie-macos-build-log
          path: build-macos.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Package application
        run: |
          set -euo pipefail
          VERSION="$(awk '/^version:/ { print $2; exit }' pubspec.yaml)"
          VERSION="${VERSION%%+*}"
          APP_PATH="$(find build/macos/Build/Products/Release -maxdepth 1 -name '*.app' -print -quit)"

          if [[ -z "$APP_PATH" ]]; then
            echo 'No macOS .app bundle was generated.' >&2
            exit 1
          fi

          if [[ "$(basename "$APP_PATH")" != '浮光掠影.app' ]]; then
            echo "Unexpected application name: $(basename "$APP_PATH")" >&2
            exit 1
          fi

          INFO_PLIST="$APP_PATH/Contents/Info.plist"
          [[ "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleName' "$INFO_PLIST")" == '浮光掠影' ]]
          [[ "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' "$INFO_PLIST")" == '浮光掠影' ]]
          [[ -s "$APP_PATH/Contents/Resources/AppIcon.icns" ]]

          codesign -d --entitlements :- "$APP_PATH" > app-entitlements.plist
          /usr/libexec/PlistBuddy \
            -c "Print :com.apple.security.network.client" \
            app-entitlements.plist | grep -qx true

          mkdir -p dist
          ARCHIVE="dist/hsmovie-${VERSION}-macos-unsigned.zip"
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "$ARCHIVE"
          shasum -a 256 "$ARCHIVE" > dist/SHA256SUMS.txt

      - name: Upload unsigned macOS package
        uses: actions/upload-artifact@v5
        with:
          name: hsmovie-macos-unsigned
          path: |
            dist/hsmovie-*-macos-unsigned.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7
